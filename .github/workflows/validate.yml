name: validate

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2

      - name: Check shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find bootstrap modules -type f -name '*.sh' -print0)

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Validate GCP stack
        working-directory: stacks/gcp/prod
        run: |
          tofu init -backend=false
          tofu validate

      - name: Validate AWS stack
        working-directory: stacks/aws/prod
        run: |
          tofu init -backend=false
          tofu validate
